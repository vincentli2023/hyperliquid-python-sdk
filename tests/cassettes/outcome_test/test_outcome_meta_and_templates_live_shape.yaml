        under the parent question''s rules.","keywords":[]},{"id":"policyRateIncrease","role":{"questionOutcome":{"parent":"policyRateDecision"}},"name":"Increase","description":"This
        outcome resolves to Yes if the Decision Value is higher than the Prior Value
        under the parent question''s rules.","keywords":[]},{"id":"policyRateNoChange","role":{"questionOutcome":{"parent":"policyRateDecision"}},"name":"No
        change","description":"This outcome resolves to Yes if the Decision Value
        equals the Prior Value, or if the parent question''s cancellation, postponement,
        or decision-deadline rule applies.","keywords":[]},{"id":"priceTouch","role":{"standaloneOutcome":{"sideNames":["Yes","No"]}},"name":"{perp}
        touches {target} by {time}","description":"The market resolves to Yes if the
        {perp} price touches {target} at or before {time}, and otherwise resolves
        to No. The price counts as touched once the {seconds}-second TWAP of {priceDescription}
        price equals or crosses {target} at any time after this market is deployed
        and at or before {time}; the market can settle as soon as a touch occurs.
        If {perp} is delisted before this market settles, the {perp} settlement price
        at delisting counts as the final price for the touch determination, and the
        market can settle at delisting if the price has not touched {target} by then.
        metadata=category:price|subCategory:N/A|semanticRestriction:This market must
        refer to the price of a Hyperliquid perp.","keywords":[["perp","hlPerp"],["priceDescription","string"],["seconds","uInt"],["target","uDecimal"],["time","dateTime"]]},{"id":"scalarPrice","role":{"standaloneOutcome":{"sideNames":["Long","Short"]}},"name":"{perp}
        from {low} to {high} at {time}","description":"If the {perp} price is at or
        above {high} at {time}, Long tokens pay out $1 each. If the price is at or
        below {low}, Long tokens pay out $0 each. Otherwise, Long tokens pay out $1
        times (price - {low}) / ({high} - {low}) each. In each case, Short tokens
        pay out $1 minus the Long payout each. Settlement is according to the {seconds}-second
        TWAP of {priceDescription} price ending at {time}. If {perp} is delisted before
        this market settles, settlement is instead according to the {perp} settlement
        price at delisting. metadata=category:price|subCategory:N/A|semanticRestriction:This
