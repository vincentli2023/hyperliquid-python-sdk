        metadata=category:price|subCategory:N/A|semanticRestriction:This market must
        refer to the price of a Hyperliquid perp.","keywords":[["perp","hlPerp"],["priceDescription","string"],["seconds","uInt"],["threshold","uDecimal"],["time","dateTime"]]},{"id":"policyRateDecision","role":"question","name":"{institution}
        {decisionLabel} rate decision","description":"This market has three possible
        results: No change, Decrease, or Increase. Exactly one corresponding named
        outcome resolves to Yes; the other two and the protocol-created fallback resolve
        to No. It covers the {decisionLabel} {institution} decision concerning {policyMeasure},
        scheduled for {scheduledDecision} UTC (the \"Decision\"). The Decision Value
        is the numeric value of {policyMeasure} announced by {officialSource}. The
        Prior Value is the value of that same measure in effect immediately before
        the Decision. No change resolves to Yes if the Decision Value equals the Prior
        Value. Decrease resolves to Yes if the Decision Value is lower. Increase resolves
        to Yes if the Decision Value is higher. If the Decision is rescheduled, the
        rescheduled decision applies if {officialSource} publishes it by {decisionDeadline}
        UTC. If the Decision is canceled or postponed without a replacement decision,
        or no official Decision Value is published by {decisionDeadline} UTC, No change
        resolves to Yes. Policy changes outside the scheduled Decision are ignored
        except when establishing the Prior Value. If {institution} replaces {policyMeasure},
        the closest official successor measure identified by {officialSource} is used.
        Resolution uses the initially published decision; later revisions do not change
        the resolution. {officialSource} is the primary resolution source; independent
        reputable reporting may be used if it has not published the relevant decision.
        No change resolves to Yes under the deadline rule above only if neither {officialSource}
        nor independent reputable reporting establishes a Decision Value by {decisionDeadline}
        UTC. metadata=category:economics|subCategory:N/A|semanticRestriction:This
        market must refer to a scheduled policy rate decision by an official institution.","keywords":[["decisionDeadline","dateTime"],["decisionLabel","string"],["institution","string"],["officialSource","string"],["policyMeasure","string"],["scheduledDecision","dateTime"]]},{"id":"policyRateDecrease","role":{"questionOutcome":{"parent":"policyRateDecision"}},"name":"Decrease","description":"This
